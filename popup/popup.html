<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="../styles/pico.min.css">
  <link rel="stylesheet" href="../styles/ui.css">
</head>
<body class="popup">
  <header class="top">
    <div class="brand">
      <img class="logo" src="../icons/icon48.png" alt="">
      <div><strong>TransVid</strong><small id="ver"></small></div>
    </div>
    <input type="checkbox" role="switch" id="enabled" aria-label="Bật lồng tiếng" title="Bật / tắt toàn bộ extension">
  </header>

  <article class="status">
    <p id="progress"></p>
    <small id="engine" class="muted"></small>
    <p id="err" class="warn" hidden></p>
  </article>

  <label for="voice">Giọng đọc</label>
  <div class="voicerow" role="group">
    <select id="voice"></select>
    <button id="preview" title="Nghe thử" aria-label="Nghe thử">▶&#xFE0E;</button>
  </div>
  <small id="voiceInfo" class="muted"></small>
  <small id="previewMsg" class="muted" hidden></small>

  <label class="vol" for="voiceVolume"><span>Âm lượng giọng đọc</span><b id="voiceVolumeVal"></b></label>
  <input type="range" id="voiceVolume" min="0" max="100" step="5">

  <div class="btns">
    <button id="retranslate" class="secondary outline">Dịch lại</button>
    <button id="options" class="secondary outline">Cài đặt</button>
    <button id="diag" class="secondary outline">Chẩn đoán</button>
  </div>
  <textarea id="diagOut" readonly hidden></textarea>

  <script src="../lib/shared.js"></script>
  <script src="../lib/voices.js"></script>
  <script src="popup.js"></script>
</body>
</html>
